[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "ghostreader"
version = "0.1.0"
description = "CLI-based AI literary analysis tool for fiction manuscripts"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-ollama>=0.2",
    "lancedb>=0.9",
    "ebooklib>=0.18",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ghostreader = "ghostreader.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=ghostreader --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/tests/*", "*/venv/*", "*/.venv/*", "ghostreader/commands/*"]

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "PIE", "PT", "RET", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
