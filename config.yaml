# LLM model (required). e.g. gemini-3.8-flash, accounts/fireworks/models/minimax-m3, gpt-4o, ollama:llama3
model: gemini-3.8-flash

# Embedding model for vector search. Default: all-MiniLM-L6-v2 (local, no API key)
embedding_model: all-MiniLM-L6-v2

# Temperature for LLM generation. null = provider default (typically 0.7-1.0)
temperature: 0.3

# Max tokens for LLM responses. null = provider default
max_tokens: null

# Genre lens for analysis prompts. null = genre-agnostic analysis
# Options: literary, fantasy, thriller, romance, sci-fi, mystery, horror, etc.
genre: null

# Analysis depth: quick, standard, or deep
depth: standard

# Output format: markdown or json
format: markdown

# Use TypeSafe.ai (Jev) for judgment severities/gates. Needs TYPESAFE_API_KEY.
typesafe_enabled: true

# Below this Choice confidence, enrich with LLM quotes (severity stays TypeSafe).
typesafe_confidence_floor: 0.55

# Consistency Noul at or above this → concern + enrich. Mid-band always LLM tie-break.
typesafe_noul_positive_threshold: 0.65

# Prior chapters (excluding N) included in companion repetition detection.
companion_craft_window: 5

# Master kill switch for cross-chapter craft (false = N-only, v1 behavior).
companion_cross_chapter_craft: true

# Ask foreshadowing/unresolved as watch-only (never flip verdict alone).
companion_info_dims: true

# Light narrative pacing + character arcs (default on; false = kill switch).
companion_light_narrative: true

# Companion register / initiation watch (heuristic + soft dims; false = off).
companion_register_watch: true

# Probe chat model JSON contract at analyze/companion start (model-switch guard).
llm_json_probe: true

# Abort when fact-extraction JSON parse fails (empty sheets poison continuity).
abort_on_fact_parse_failure: true

# Analyze repetition feed: max word / phrase / sentence-pattern rows.
# Always applied (not gated by analyze_grounding_hardening).
analyze_repetition_words: 50
analyze_repetition_phrases: 40
analyze_repetition_patterns: 20

# Hit-weighted manuscript excerpt ceiling (chars, headers included).
analyze_excerpt_total_budget: 100000
analyze_excerpt_window_chars: 900
analyze_excerpt_min_per_chapter: 400

# Continuity enrich/tie-break combined ceiling (sheets + manuscript).
analyze_continuity_enrich_total_budget: 120000

# Hit-weighted excerpts + empty-evidence retry/fallback/demotion.
# false restores legacy flat excerpts and skips those policies.
# Does NOT revert analyze_repetition_* caps or kind/pattern examples.
analyze_grounding_hardening: true

# Continuity enrich signal_kind + tone_understatement plot_holes demotion.
# false skips asking/parsing signal_kind and the tone demotion.
analyze_continuity_signal_kind: true

# Max algorithmic repetition_findings rows in analyze JSON export.
analyze_repetition_findings_cap: 40

# Enrich TypeSafe strength findings in the Choice enrich batch.
# false keeps high-conf strengths as template stubs (companion-like).
analyze_enrich_strengths: true

# Drop empty-evidence strengths from findings lists after prioritize.
# Dimension ratings still show strength; TypeSafe-off summary prose unchanged.
analyze_omit_empty_strengths: true

# Analyze heuristic register_findings on standard/deep (false = always []).
analyze_register_watch: true
